<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Notyf CSS & JS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
<script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>

</head>

<body class="flex justify-center items-center min-h-screen bg-gray-900 text-white">
  <!-- Calculator Container -->
  <div class="bg-gray-800 w-80 rounded-2xl shadow-2xl overflow-hidden">

    <!-- Input Section -->
    <div class="p-5 bg-gray-800 text-right border-b border-gray-700">
      <input 
        id="display" 
        type="text" 
        placeholder="0"
        class="w-full text-right text-4xl font-mono font-bold bg-gray-900 text-white  p-3 rounded-lg shadow-inner shadow-emerald-700/40"
       readonly
      >
    </div>


    <!-- Buttons Section -->
    <div class="flex flex-col  gap-2 p-4">
      <!-- Row 1 -->

      <div class="w-full flex  flex-row gap-2"> 
        <button onclick="displaySign('%')" class="py-3 w-full font-bold rounded-xl bg-gray-700 hover:bg-gray-600 transition">% </button>
        <button onclick="clearAll()" class=" w-full py-3 font-bold rounded-xl bg-gray-700 hover:bg-gray-600 transition">AC</button>
        <button onclick="removeChar()" class=" w-full py-3 font-bold rounded-xl  bg-blue-600 hover:bg-blue-500 transition">
            <img src="delete.png" alt="del" class="w-5 mx-auto">
        </button>
        <button onclick="displaySign('/')" class=" w-full py-3 font-bold rounded-xl  bg-blue-600 hover:bg-blue-500 transition">/</button>
        </div>

      <!-- Row 2 -->
       <div class="w-full flex  flex-row gap-2"> 
      <button onclick="displayNumber(7)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">7</button>
      <button onclick="displayNumber(8)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">8</button>
      <button onclick="displayNumber(9)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">9</button>
      <button onclick="displaySign('*')" class="btn w-full py-3 rounded-xl font-bold  bg-blue-600 hover:bg-blue-500 transition">×</button>
       </div>

      <!-- Row 3 -->
       <div class="w-full flex  flex-row gap-2"> 
      <button onclick="displayNumber(4)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">4</button>
      <button onclick="displayNumber(5)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">5</button>
      <button onclick="displayNumber(6)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">6</button>
      <button onclick="displaySign('+')" class="btn w-full py-3 font-bold rounded-xl  bg-blue-600 hover:bg-blue-500 transition">+</button>
       </div>

      <!-- Row 4 -->
       <div class="w-full flex  flex-row gap-2"> 
      <button onclick="displayNumber(1)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">1</button>
      <button onclick="displayNumber(2)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">2</button>
      <button onclick="displayNumber(3)" class="w-full py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">3</button>
      <button onclick="displaySign('-')" class="btn w-full py-3 font-bold rounded-xl  bg-blue-600 hover:bg-blue-500 transition">−</button>
       </div>
      <!-- Row 5 -->
       <div class="w-full flex  flex-row gap-2">     
         <button onclick="displaySign('.')" class="w-3/5 py-3 font-bold rounded-xl bg-gray-700 hover:bg-gray-600 transition">.</button>
          <button onclick="displayNumber(0)" class="w-4/5 py-3 rounded-xl bg-gray-700 hover:bg-gray-600 transition">0</button>
          <button onclick="calculate()" class="btn w-full  py-3 font-bold rounded-xl bg-blue-600 hover:bg-blue-500 transition">=</button>
        </div>
    </div>
</div>

  <!-- Script -->
  <script src="app.js"></script>
</body>
</html>
